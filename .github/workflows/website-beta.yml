name: Website beta checks
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-beta.yml']
concurrency:
  group: website-beta-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
  hosted-beta:
    # Explicit operator opt-in on this beta branch. No account credentials or deploy step.
    if: github.head_ref == 'codex/issue-7-website-studio'
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    env:
      RR_BETA_BASE_URL: https://rise-roost-beta.joshua-maziarz1.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: opt-in
        run: |
          subject=$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%s)
          case "$subject" in
            *'[verify-beta]'*)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              echo 'suite=full' >> "$GITHUB_OUTPUT" ;;
            *'[verify-pages]'*)
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              echo 'suite=pages' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-node@v5
        if: steps.opt-in.outputs.enabled == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        if: steps.opt-in.outputs.enabled == 'true'
      - run: npm run test:worker
        if: steps.opt-in.outputs.enabled == 'true'
      - run: node tests/hosted-api.mjs
        if: steps.opt-in.outputs.enabled == 'true'
      - run: npm run test:browser -- --max-failures=1
        if: steps.opt-in.outputs.suite == 'full'
      - run: npm run test:browser -- --grep 'responsive public' --max-failures=1
        if: steps.opt-in.outputs.suite == 'pages'
      - id: evidence
        run: npm run screenshots
        if: steps.opt-in.outputs.enabled == 'true'
      - uses: actions/upload-artifact@v4
        if: steps.evidence.outcome == 'success'
        with:
          name: hosted-beta-screenshots
          path: |
            website/docs/screenshots/*.png
            website/qa-results/hosted-api.json
          retention-days: 7
# Intentionally no deployment step, production credentials, or write permissions.
  root-sync:
    if: github.head_ref == 'codex/issue-7-website-studio'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: opt-in
        run: |
          subject=$(git -c safe.directory="$GITHUB_WORKSPACE" log -1 --format=%s)
          case "$subject" in
            *'[sync-repro]'*) echo 'mode=reproduce' >> "$GITHUB_OUTPUT" ;;
            *'[verify-sync]'*|*'[verify-beta]'*) echo 'mode=verify' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-node@v5
        if: steps.opt-in.outputs.mode != ''
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        if: steps.opt-in.outputs.mode != ''
      - run: node tests/root-sync.mjs --reproduce
        if: steps.opt-in.outputs.mode == 'reproduce'
      - run: node tests/root-sync.mjs
        if: steps.opt-in.outputs.mode == 'verify'
