name: Website beta checks
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-beta.yml']
concurrency:
  group: website-beta-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
  hosted-beta:
    # Explicit operator opt-in on this beta branch. No account credentials or deploy step.
    if: github.head_ref == 'codex/issue-7-website-studio'
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    env:
      RR_BETA_BASE_URL: https://rise-roost-beta.joshua-maziarz1.workers.dev
    steps:
      - uses: actions/checkout@v5
      - id: opt-in
        run: |
          case "$(git log -1 --format=%s)" in
            *'[verify-beta]'*) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-node@v5
        if: steps.opt-in.outputs.enabled == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        if: steps.opt-in.outputs.enabled == 'true'
      - run: npm run test:worker
        if: steps.opt-in.outputs.enabled == 'true'
      - run: npm run test:browser
        if: steps.opt-in.outputs.enabled == 'true'
      - run: npm run screenshots
        if: steps.opt-in.outputs.enabled == 'true'
      - uses: actions/upload-artifact@v4
        if: always() && steps.opt-in.outputs.enabled == 'true'
        with:
          name: hosted-beta-screenshots
          path: website/docs/screenshots/*.png
          retention-days: 7
# Intentionally no deployment step, production credentials, or write permissions.
