name: Website beta checks
on:
  pull_request:
    paths: ['website/**', '.github/workflows/website-beta.yml']
concurrency:
  group: website-beta-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
      - run: npm run check
        env:
          WRANGLER_SEND_METRICS: 'false'
# Intentionally no deployment step, production credentials, or write permissions.
