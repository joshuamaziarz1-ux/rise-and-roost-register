<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe5">
<title>Rise & Roost Register v5.0</title>
<link rel="stylesheet" href="styles.css?v=4.7.2">
<link rel="stylesheet" href="v4.8-kiosk.css?v=5.0.0">
<style>
  .rr48-home-logo,.rr48-shop-logo,.rr48-thanks-logo,.rr48-pay-logo img,.rr48-topbrand img{object-fit:contain!important;background:#fff!important}
  .top #adminBtn,.store-tabs,.version{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div><div class="logo">Rise & Roost</div><div class="sub">Self-Serve Farm Store</div></div>
</header>

<main class="layout" id="shopView">
  <section class="card shop">
    <h2>Shop</h2>
    <p class="hint">Tap an item to add it to your order.</p>
    <div id="productArea"></div>
  </section>
  <aside class="card cart">
    <h2>Your Order</h2>
    <p class="hint" id="cartHint">Nothing added yet.</p>
    <div class="cart-list" id="cartList"></div>
    <div class="total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <button class="btn primary wide pay" id="payBtn" disabled>Pay</button>
    <button class="btn ghost wide" id="clearBtn" disabled>Cancel / Clear Order</button>
  </aside>
</main>

<main class="layout hidden" id="pickupView" style="grid-template-columns:1fr">
  <section class="card pickup-customer">
    <h2>Pickup Order</h2>
    <div class="pickup-search">
      <input id="pickupCodeInput" maxlength="8" autocomplete="off" placeholder="Pickup code">
      <button class="btn primary" id="findPickupBtn">Find Order</button>
    </div>
    <div id="pickupCustomerResult"></div>
  </section>
</main>

<div class="overlay hidden" id="payOverlay">
  <div class="modal">
    <h2>Confirm Purchase</h2>
    <div class="big" id="payTotal">$0.00</div>
    <div class="actions">
      <button class="btn ghost" id="backPay">Go Back</button>
      <button class="btn primary" id="finishSale">Complete Purchase</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="thanks">
  <div class="modal" style="text-align:center">
    <h2>Thank You!</h2>
    <p style="font-size:1.12rem" class="rr48-thanks-copy">Your purchase is complete.</p>
    <div id="rr48Countdown" class="hint"></div>
    <button class="btn primary wide" id="doneThanks">Done</button>
  </div>
</div>

<script src="test-storage.js?v=5.0.0"></script>
<script src="v5-register-core.js?v=5.0.0"></script>
<script src="v4.8-kiosk.js?v=5.0.0"></script>
<script src="v4.8-payments.js?v=5.0.0"></script>
<script src="v4.8-logo.js?v=5.0.0"></script>
<script src="v4.8-roost.js?v=5.0.0"></script>
<script src="v4.10-home.js?v=5.0.0"></script>
</body>
</html>
