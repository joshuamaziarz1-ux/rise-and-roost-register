name = "rise-roost-private-backup-trigger"
main = "server/backup-dispatch-worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["15 7 * * *"]

[vars]
BACKUP_TRIGGER_ENABLED = "false"
BACKUP_WORKFLOW_REF = "main"
