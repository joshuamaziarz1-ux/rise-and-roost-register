name = "rise-roost-website-beta"
main = "server/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "rise-roost-website-demo"
# Replace only after creating a NEW isolated demo database; never use the live Supabase project.
database_id = "00000000-0000-0000-0000-000000000000"
