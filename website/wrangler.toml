name = "rise-roost-beta"
main = "server/worker.mjs"
compatibility_date = "2025-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "rise-roost-beta-db"
# Dedicated beta D1 database; no production database or custom-domain binding.
database_id = "7824ffe0-d69a-4221-9aec-0f335257477a"

[vars]
# Public identifier, not an access key. Only this workspace publishes to the root beta.
PUBLIC_WORKSPACE_ID = "be1fcd22410ed1f18cab57eddf780aa840c2b2213ab123ae"
# Transactional email stays off until a verified sender and a beta-only API key exist.
ORDER_EMAIL_ENABLED = "false"

[triggers]
crons = ["*/5 * * * *"]
